name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上连续推送时，取消尚未完成的旧运行，省掉排队等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.19 是 package.json engines 的下限，24 是 DSH 桌面端内置的运行时
        node: ['22.19', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 注意：本仓库有意不提交 lockfile —— 宿主 DSH 才是真正的解析器，
      # 插件只把 @deepseek-ai/* 声明为 peer/可选依赖，CI 只需拿到能跑测试的副本。
      # 所以用 install 而不是 ci（ci 要求 lockfile 存在）。
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # 快速语法体检：覆盖宿主页与浏览器页，挡住 lib/client.js 这类非 Node 入口的低级错误
      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # 确认 package.json 的 files / exports 真的能打出可用产物，
      # 并列出将要发布的文件，避免误带 node_modules 或漏掉 lib/client.js
      - name: npm pack dry run
        run: npm pack --dry-run
